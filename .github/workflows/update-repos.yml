name: 🔄 Auto Update GitHub README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Generate Project Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: shrijal10333
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import re

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GITHUB_TOKEN"]

          README = "README.md"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "samaksh-readme-updater"
          }

          def github_request(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(
                      response.read().decode()
                  )

          # =========================================================
          # FETCH ALL PUBLIC REPOSITORIES
          # =========================================================
          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/"
                  f"{urllib.parse.quote(username)}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )
              data = github_request(url)
              if not data:
                  break
              repos.extend(data)
              if len(data) < 100:
                  break
              page += 1

          # =========================================================
          # REMOVE PROFILE README REPOSITORY
          # =========================================================
          repos = [
              repo
              for repo in repos
              if repo["name"].lower() != username.lower()
          ]

          # =========================================================
          # SORT BY LAST UPDATE
          # =========================================================
          repos.sort(
              key=lambda repo: repo.get(
                  "updated_at",
                  ""
              ),
              reverse=True
          )

          # =========================================================
          # EMOJI SYSTEM
          # =========================================================
          def get_emoji(repo):
              name = repo["name"].lower()

              if any(word in name for word in [
                  "bot",
                  "discord"
              ]):
                  return "🤖"

              if any(word in name for word in [
                  "panel",
                  "dashboard"
              ]):
                  return "🎛️"

              if any(word in name for word in [
                  "server",
                  "vps",
                  "hosting",
                  "vm"
              ]):
                  return "🖥️"

              if any(word in name for word in [
                  "payment",
                  "gateway"
              ]):
                  return "💳"

              if any(word in name for word in [
                  "website",
                  "web",
                  "site"
              ]):
                  return "🌐"

              if any(word in name for word in [
                  "game",
                  "gaming",
                  "tournament"
              ]):
                  return "🎮"

              if any(word in name for word in [
                  "ai",
                  "gpt",
                  "chat"
              ]):
                  return "🤖"

              if any(word in name for word in [
                  "api"
              ]):
                  return "⚡"

              if any(word in name for word in [
                  "mobile",
                  "android",
                  "ios"
              ]):
                  return "📱"

              if any(word in name for word in [
                  "shop",
                  "store",
                  "ecommerce"
              ]):
                  return "🛍️"

              return "🚀"

          # =========================================================
          # CLEAN PROJECT NAME
          # =========================================================
          def pretty_name(name):
              name = name.replace("-", " ")
              name = name.replace("_", " ")
              return name.strip().title()

          # =========================================================
          # CREATE CARDS
          # =========================================================
          cards = []

          for repo in repos:
              name = repo["name"]
              title = pretty_name(name)
              emoji = get_emoji(repo)
              description = repo.get("description")

              if not description:
                  description = (
                      "An experimental project "
                      "built by Samaksh."
                  )

              description = (
                  description
                  .replace("\n", " ")
                  .strip()
              )

              if len(description) > 150:
                  description = (
                      description[:147]
                      + "..."
                  )

              language = repo.get("language")

              if language:
                  language_text = (
                      f"**{language}**"
                  )
              else:
                  language_text = "**Project**"

              stars = repo.get(
                  "stargazers_count",
                  0
              )

              forks = repo.get(
                  "forks_count",
                  0
              )

              repo_url = repo["html_url"]

              card = f"""
          <td width="50%" valign="top">

          ### {emoji} {title}

          {language_text}

          {description}

          <br/>

          ⭐ `{stars}` &nbsp;&nbsp; 🍴 `{forks}`

          <br/><br/>

          <a href="{repo_url}">
          <img src="https://img.shields.io/badge/VIEW_PROJECT-8B5CF6?style=for-the-badge&logo=github&logoColor=white"/>
          </a>

          </td>
          """

              cards.append(card)

          # =========================================================
          # BUILD PROJECT TABLE
          # =========================================================
          project_html = """
          <div align="center">

          <table>

          """

          for index in range(
              0,
              len(cards),
              2
          ):
              project_html += "<tr>\n"
              project_html += cards[index]

              if index + 1 < len(cards):
                  project_html += (
                      cards[index + 1]
                  )
              else:
                  project_html += """
          <td width="50%"></td>
          """

              project_html += "\n</tr>\n"

          project_html += """

          </table>

          </div>

          """

          # =========================================================
          # AUTOMATIC PROJECT COUNT
          # =========================================================
          project_count = len(repos)

          header = f"""
          <div align="center">

          ### 🚀 `{project_count} Projects & Counting...`

          <br/>

          <sub>
          Automatically synchronized with my GitHub repositories.
          </sub>

          </div>

          """

          project_html = (
              header
              + project_html
          )

          # =========================================================
          # UPDATE README PROJECT SECTION
          # =========================================================
          with open(
              README,
              "r",
              encoding="utf-8"
          ) as file:
              readme = file.read()

          start_marker = "<!-- PROJECTS_START -->"
          end_marker = "<!-- PROJECTS_END -->"

          pattern = (
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker)
          )

          replacement = (
              start_marker
              + "\n\n"
              + project_html
              + "\n"
              + end_marker
          )

          new_readme = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )

          if new_readme == readme:
              print(
                  "ERROR: Project markers not found."
              )
              raise SystemExit(1)

          # =========================================================
          # WRITE README
          # =========================================================
          with open(
              README,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(new_readme)

          print(
              f"✅ Successfully synchronized "
              f"{project_count} repositories."
          )
          PY

      - name: 🔍 Show README Changes
        run: |
          git diff -- README.md

      - name: 💾 Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected."
          else
            git commit -m "🤖 Auto update project showcase"
            git push
          fi
